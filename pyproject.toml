[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anistroph"
version = "0.1.0"
description = "Anistroph — extensible, domain-agnostic predictive analytics platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anistroph" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "polars>=0.20",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
