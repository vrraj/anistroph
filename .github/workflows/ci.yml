name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Most tests build small temporary fixtures. Only these two generated
      # sources are read directly by the integration tests.
      - name: Generate required test data
        run: |
          python scripts/generate_semiconductor_yield_data.py
          python scripts/generate_semiconductor_memory_supply.py --products 100

      - name: Run tests
        run: python -m pytest -q
