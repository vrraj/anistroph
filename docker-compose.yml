version: "3.8"

services:
  anistroph:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./datasets:/app/datasets
    environment:
      - ANISTROPH_HOST=0.0.0.0
      - ANISTROPH_PORT=8000
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  mcp:
    build: .
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./datasets:/app/datasets
    command: python -m backend.integrations.mcp.server
    stdin_open: true
