services:
  # Anistroph Web Application + REST API + UI
  webapp:
    build: .
    container_name: anistroph-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
        tag: "{{.Name}}/{{.ID}}"
    ports:
      - "9500:9500"
    # Development: use --reload for hot code reload.
    # Production: use `python -m uvicorn backend.main:app --host 0.0.0.0 --port 9500`
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 9500 --reload
    volumes:
      # Bind mount — map host project root to the working directory in the container
      - .:/app
      # Persistent storage for generated data (CSV, Parquet)
      - ./data:/app/data
      # Persistent storage for model artifacts and registries
      - ./artifacts:/app/artifacts
      # Dataset configs (reference + examples)
      - ./datasets:/app/datasets
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9500/health')\" || exit 1"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # Anistroph MCP Server (stdio transport)
  mcp:
    build: .
    container_name: anistroph-mcp
    restart: unless-stopped
    command: python -m backend.integrations.mcp.server
    stdin_open: true
    volumes:
      # Bind mount — same as webapp
      - .:/app
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./datasets:/app/datasets
    depends_on:
      webapp:
        condition: service_healthy
